name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: kanarikanaru/sensitive-detector

jobs:
  # see https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    name: Build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    if: github.repository == 'HanaMisskey/sensitive-detector'
    outputs:
      image-tag: ${{ steps.stamp_version.outputs.image_tag }}
      package-version: ${{ steps.stamp_version.outputs.package_version }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Check out the repo
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Stamp package version
        id: stamp_version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const core = pkg.version.split(/[+-]/)[0];
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(core)) {
            throw new Error(`Invalid base version: ${pkg.version}`);
          }
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const buildCount = git('rev-list', '--count', 'HEAD');
          const shortSha = git('rev-parse', '--short', 'HEAD');
          const version = `${core}-hanami.${buildCount}+${shortSha}`;
          const imageTag = `${process.env.GITHUB_REF_NAME}-${version}`
            .toLowerCase().replace(/[^a-z0-9_.-]/g, '-');
          if (!/^[a-z0-9_][a-z0-9_.-]{0,127}$/.test(imageTag)) {
            throw new Error(`Invalid Docker tag (maximum 128 characters): ${imageTag}`);
          }

          pkg.version = version;
          writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `package_version=${version}\nimage_tag=${imageTag}\n`);
          NODE
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.stamp_version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.stamp_version.outputs.package_version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.build.outputs.image-tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.package-version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
